x-database-url: &database-url "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=18&charset=utf8"

services:
  php:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: ":80"
      DATABASE_URL: *database-url
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/app

  worker:
    build: .
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    healthcheck:
      disable: true
    volumes:
      - ./:/app

  front:
    build: docker/node
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front:/app

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql

volumes:
  database_data:
